# zinc's self-host manifest: zinc described as a single-member workspace so
# 'zinc build' builds zinc itself (the MVP definition of done). The [workspace]
# and [package]/[build] sections coexist in one file (member ".").
[workspace]
members = ["."]
ghc = "9.12.2"

[package]
name = "zinc"
version = "0.1.0.0"

[build.lib]
source-dirs = ["src"]
# Modules are auto-discovered from source-dirs (spec §4, no module hiding).
depends = [
  "base", "Cabal", "SHA", "bytestring", "containers", "directory",
  "filepath", "optparse-applicative", "process", "stm", "time", "toml-parser", "transformers"
]

[build.exe.zinc]
source-dirs = ["app"]
main = "Main.hs"
ghc-options = ["-threaded", "-rtsopts", "-with-rtsopts=-N"]
# process: Main execs `zinc run` via System.Process (inherited stdio).
depends = ["base", "process", "zinc"]

[build.test.spec]
source-dirs = ["test"]
main = "Spec.hs"
depends = ["base", "Cabal", "directory", "filepath", "process", "stm", "zinc", "hspec"]

# Whole non-boot closure pinned by rev to the versions GHC/Nix ships zinc
# against (so zinc's own source compiles). Boot libs incl. Cabal come from GHC.
[dependencies]
# Each dependency vertically: rev pin + repo override + optional ghc-options.

[dependencies.SHA]
rev = "9653669162f411b0250e83ddbdb375ff0a63e6eb"
repo = "https://github.com/GaloisInc/SHA.git"

